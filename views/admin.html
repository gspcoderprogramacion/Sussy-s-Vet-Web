<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Panel | Sussy's Vet</title><link rel="icon" href="../assets/logo_sussys.png"><link rel="stylesheet" href="../css/dashboard.css"></head><body><header class="dash-header"><a href="../index.html"><img src="../assets/logo_sussys.png" alt="Sussy's Vet"></a><div><span id="user-label"></span><button id="logout" class="button muted">Cerrar sesión</button></div></header><main class="container"><h1>Administración</h1><p>Gestiona las cuentas de veterinarios de la clínica.</p><section class="card"><h2 id="vet-form-title">Crear veterinario</h2><form id="vet-form" class="grid-form"><input type="hidden" name="id"><label>Usuario<input name="username" required maxlength="60"></label><label>Nombre completo<input name="full_name" required maxlength="120"></label><label>Empresa / clínica<input name="company_name" required maxlength="160"></label><label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña temporal<input name="password" type="password" minlength="10" autocomplete="new-password"><small>Al editar, déjala vacía para conservar la contraseña.</small></label><div class="actions"><button class="button primary" type="submit">Guardar veterinario</button><button id="cancel-edit" class="button muted" type="button" hidden>Cancelar</button></div></form><p id="form-message" class="message" role="status"></p></section><section class="card"><h2>Veterinarios</h2><div class="table-scroll"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Empresa</th><th>Correo</th><th>Acciones</th></tr></thead><tbody id="vets-body"><tr><td colspan="5">Cargando…</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/dashboard-auth.js"></script><script src="../js/admin.js"></script></body></html>
